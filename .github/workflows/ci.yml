name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: saga_svc
          POSTGRES_PASSWORD: saga_local_pw
          POSTGRES_DB: saga_db
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U saga_svc -d saga_db"
          --health-interval 5s --health-timeout 3s --health-retries 20
      # Local AWS emulator for the SNS/SQS tests.
      floci:
        image: floci/floci:2.0.1
        ports: ["4566:4566"]
        options: >-
          --health-cmd "curl -fs http://localhost:4566/_floci/health"
          --health-interval 5s --health-timeout 3s --health-retries 30
    env:
      DATABASE_URL: postgresql://saga_svc:saga_local_pw@localhost:5432/saga_db
      TEST_DATABASE_URL: postgresql://saga_svc:saga_local_pw@localhost:5432/saga_test
      TEST_AWS_ENDPOINT_URL: http://localhost:4566
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Migrations round-trip (up, down, up)
        run: npm run db:migrate && npm run db:rollback && npm run db:migrate
      - name: Unit + integration tests (state machine, flows, recovery, SNS/SQS against Floci)
        run: npm test
      - run: npm run build

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build runtime and migrate images (not pushed until Phase 7)
        run: |
          docker buildx build --target runtime -t ecommerce-saga-orchestrator:${{ github.sha }} --load .
          docker buildx build --target migrate -t ecommerce-saga-orchestrator-migrate:${{ github.sha }} --load .
